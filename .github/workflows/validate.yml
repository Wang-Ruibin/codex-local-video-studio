name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python scripts/validate_repository.py
      - name: Run cross-platform tests
        run: python -m unittest discover -s tests -v
      - name: Install render dependencies
        run: python -m pip install -r plugins/codex-local-video-studio/skills/local-video-studio/scripts/requirements.txt
      - name: Render MP4 smoke fixture
        run: python tests/smoke_render.py
